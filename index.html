<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tom Nærland</title>
<meta name="description" content="Tom Nærland — ultrasound software engineer, mathematician, noise, visualization and realtime reprojection artist.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cpolygon points='16,6 21,26 11,26' fill='%23eef0f3'/%3E%3C/svg%3E">
<style>
  @font-face{font-family:'Archivo';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/Archivo.ttf') format('truetype');}
  @font-face{font-family:'Martian Mono';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/MartianMono.ttf') format('truetype');}
  html,body{margin:0;padding:0;background:#000;overflow:hidden;}
  *{box-sizing:border-box;}
  a,div,span,p{-webkit-user-select:text;user-select:text;}
  a{-webkit-user-drag:none;}
</style>
</head>
<body>
<div id="obx-wrap" style="position:fixed;top:0;left:0;right:0;height:100vh;height:100svh;background:#000;font-family:'Archivo',sans-serif;overflow:hidden;">

  <nav id="obx-nav" style="position:absolute;top:20px;left:20px;z-index:20;display:flex;flex-direction:column;gap:6px;font-family:'Martian Mono',monospace;color:#fff;mix-blend-mode:difference;opacity:1;transition:opacity .45s ease;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;">
    <div style="font-size:14px;font-weight:400;letter-spacing:.10em;color:currentColor;width:fit-content;padding:10px 0;line-height:1;">Tom Nærland</div>
    <a id="obx-navwork" href="#" style="font-size:14px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:currentColor;opacity:1;transition:opacity .25s;width:fit-content;padding:10px 0;line-height:1;">Work</a>
    <a id="obx-navcv" href="#" style="font-size:14px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:currentColor;opacity:1;transition:opacity .25s;width:fit-content;padding:10px 0;line-height:1;">CV</a>
    <a id="obx-navcontact" href="#" style="font-size:14px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:currentColor;opacity:1;transition:opacity .25s;width:fit-content;padding:10px 0;line-height:1;">Contact</a>
  </nav>

  <div id="obx-work" style="position:absolute;inset:0;opacity:0;transition:opacity .4s ease;pointer-events:none;background:#000;overflow:hidden;">
    <video id="obx-video" preload="auto" autoplay loop muted playsinline style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);min-width:100%;min-height:100%;width:auto;height:auto;object-fit:cover;">
      <source src="obelisken.mp4" type="video/mp4">
    </video>
    <canvas id="obx-workcanvas" style="position:absolute;inset:0;width:100%;height:100%;display:block;mix-blend-mode:difference;pointer-events:none;"></canvas>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;pointer-events:none;font-family:'Martian Mono',monospace;color:#fff;mix-blend-mode:difference;padding-bottom:18vh;">
      <div style="font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.55);">Work</div>
      <a id="obx-worklink" href="https://vimeo.com/tomana" target="_blank" rel="noopener" style="font-size:clamp(18px,2.4vw,30px);letter-spacing:.04em;color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.4);padding-bottom:2px;">vimeo.com/tomana</a>
    </div>
  </div>

  <div id="obx-contact" style="position:absolute;inset:0;opacity:0;transition:opacity .4s ease;pointer-events:none;background:#000;overflow:hidden;">
    <video id="obx-video2" preload="auto" loop muted playsinline style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);min-width:100%;min-height:100%;width:auto;height:auto;object-fit:cover;">
      <source src="illd.mp4" type="video/mp4">
    </video>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;pointer-events:none;font-family:'Martian Mono',monospace;color:#fff;mix-blend-mode:difference;padding-bottom:18vh;">
      <div style="font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.55);">Contact</div>
      <a id="obx-mail" href="#" style="font-size:clamp(18px,2.4vw,30px);letter-spacing:.04em;color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.4);padding-bottom:2px;">&nbsp;</a>
    </div>
  </div>

  <div id="obx-cv" style="position:absolute;inset:0;opacity:0;transition:opacity .4s ease;pointer-events:none;background:#000 center/cover no-repeat url(cv-bg.png);overflow:hidden;">
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;pointer-events:none;font-family:'Martian Mono',monospace;color:#fff;mix-blend-mode:difference;padding-bottom:18vh;">
      <div style="font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.55);">CV</div>
      <p style="margin:0;max-width:min(560px,80vw);text-align:center;font-size:clamp(13px,1.5vw,17px);line-height:1.7;letter-spacing:.02em;color:#fff;">Ultrasound Software Engineer, Master of Mathematics, small-stage noise, visualization and realtime reprojection artist</p>
    </div>
  </div>

</div>

<script>
"use strict";
(function(){
  // ---- element handles ----
  var EL = {};
  ['wrap','nav','work','video','worklink','workcanvas','contact','video2','mail','cv',
   'navwork','navcv','navcontact'].forEach(function(k){ EL[k]=document.getElementById('obx-'+k); });

  var DPR=Math.min(window.devicePixelRatio||1, 2);
  var A = { faces:[], octx:null };
  var S = { page:null, mailSet:false, _routing:false };

  // ================= geometry: the rig =================
  function norm(a,b,c){var ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2],vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];
    var nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;var l=Math.hypot(nx,ny,nz)||1;return [nx/l,ny/l,nz/l];}

  function buildScene(){
    var faces=[];
    var Acol={ frame:[0.094,0.092,0.088], post:[0.083,0.081,0.078], pyr:[0.046,0.045,0.043],
      plinth:[0.075,0.073,0.070], device:[0.050,0.049,0.048], mesh:[0.038,0.037,0.036],
      cable:[0.046,0.045,0.044], lensrim:[0.150,0.149,0.147] };
    function pushQuad(a,b,c,d,al){faces.push({v:[a,b,c,d],n:norm(a,b,c),al:al});}
    function pushTri(a,b,c,al){faces.push({v:[a,b,c],n:norm(a,b,c),al:al});}
    function box(cx,cy,cz,hx,hy,hz,al){
      var x0=cx-hx,x1=cx+hx,y0=cy-hy,y1=cy+hy,z0=cz-hz,z1=cz+hz,p=function(x,y,z){return [x,y,z];};
      pushQuad(p(x1,y0,z0),p(x1,y0,z1),p(x1,y1,z1),p(x1,y1,z0),al);
      pushQuad(p(x0,y0,z1),p(x0,y0,z0),p(x0,y1,z0),p(x0,y1,z1),al);
      pushQuad(p(x0,y1,z0),p(x1,y1,z0),p(x1,y1,z1),p(x0,y1,z1),al);
      pushQuad(p(x0,y0,z1),p(x1,y0,z1),p(x1,y0,z0),p(x0,y0,z0),al);
      pushQuad(p(x0,y0,z1),p(x0,y1,z1),p(x1,y1,z1),p(x1,y0,z1),al);
      pushQuad(p(x1,y0,z0),p(x1,y1,z0),p(x0,y1,z0),p(x0,y0,z0),al);
    }
    function ring(yc,half,beam,al){
      box(0,yc,half,half,beam,beam,al); box(0,yc,-half,half,beam,beam,al);
      box(half,yc,0,beam,beam,half,al); box(-half,yc,0,beam,beam,half,al);
    }
    function rod(a,b,r,al){
      var dx=b[0]-a[0],dy=b[1]-a[1],dz=b[2]-a[2];var dl=Math.hypot(dx,dy,dz)||1;dx/=dl;dy/=dl;dz/=dl;
      var ux=0,uy=1,uz=0; if(Math.abs(dy)>0.95){ux=1;uy=0;}
      var s1x=dy*uz-dz*uy,s1y=dz*ux-dx*uz,s1z=dx*uy-dy*ux;var l1=Math.hypot(s1x,s1y,s1z)||1;s1x/=l1;s1y/=l1;s1z/=l1;
      var s2x=dy*s1z-dz*s1y,s2y=dz*s1x-dx*s1z,s2z=dx*s1y-dy*s1x;
      function cor(p,a1,a2){return [p[0]+s1x*a1+s2x*a2,p[1]+s1y*a1+s2y*a2,p[2]+s1z*a1+s2z*a2];}
      var A0=cor(a,-r,-r),A1=cor(a,r,-r),A2=cor(a,r,r),A3=cor(a,-r,r);
      var B0=cor(b,-r,-r),B1=cor(b,r,-r),B2=cor(b,r,r),B3=cor(b,-r,r);
      pushQuad(A0,A1,B1,B0,al); pushQuad(A1,A2,B2,B1,al); pushQuad(A2,A3,B3,B2,al); pushQuad(A3,A0,B0,B3,al);
    }
    var HALF=0.46,BEAM=0.045,POST=0.05,TOWER_Y0=0.92,TOWER_Y1=6.35;
    var HALF_TOP=HALF-(TOWER_Y1-TOWER_Y0)*Math.tan(1.15*Math.PI/180);
    function halfAt(y){return HALF + (HALF_TOP-HALF)*Math.max(0,Math.min(1,(y-TOWER_Y0)/(TOWER_Y1-TOWER_Y0)));}
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(s){var sx=s[0],sz=s[1];
      rod([sx*HALF,TOWER_Y0,sz*HALF],[sx*HALF_TOP,TOWER_Y1,sz*HALF_TOP],POST,Acol.post);});
    (function(){
      var by=TOWER_Y0+0.04, OUT=0.52, EH=HALF+OUT;
      box(0,by, HALF, EH,BEAM,BEAM,Acol.frame);
      box(0,by,-HALF, EH,BEAM,BEAM,Acol.frame);
      box( HALF,by,0, BEAM,BEAM,EH,Acol.frame);
      box(-HALF,by,0, BEAM,BEAM,EH,Acol.frame);
    })();
    ring(2.85,halfAt(2.85),BEAM*0.85,Acol.frame);
    ring(4.35,halfAt(4.35),BEAM,Acol.frame);
    ring(5.95,halfAt(5.95),BEAM,Acol.frame);
    ring(TOWER_Y1,HALF_TOP,BEAM,Acol.frame);
    rod([0,4.35,halfAt(4.35)],[0,5.95,halfAt(5.95)],0.035,Acol.frame);
    (function(){
      var h=HALF_TOP+BEAM,baseY=TOWER_Y1+BEAM,ph=h*2*0.636,apex=[0,baseY+ph,0];
      var c=[[-h,baseY,-h],[h,baseY,-h],[h,baseY,h],[-h,baseY,h]];
      pushTri(c[3],c[2],apex,Acol.pyr); pushTri(c[1],c[0],apex,Acol.pyr);
      pushTri(c[2],c[1],apex,Acol.pyr); pushTri(c[0],c[3],apex,Acol.pyr);
    })();
    box(0,5.62,0.18,0.22,0.05,0.07,Acol.device);
    box(0,5.50,0.18,0.05,0.07,0.04,Acol.device);
    box(-0.05,5.62,0.255,0.045,0.045,0.02,Acol.lensrim);
    box(0.11,5.63,0.255,0.05,0.03,0.018,Acol.frame);
    box(-0.04,5.02,0.16,0.21,0.17,0.16,Acol.device);
    box(-0.10,5.02,0.33,0.085,0.085,0.02,Acol.lensrim);
    box(-0.10,5.02,0.355,0.055,0.055,0.012,Acol.device);
    box(0.30,5.05,0.06,0.10,0.26,0.20,Acol.mesh);
    for(var i=0;i<4;i++){var oxx=(i-1.5)*0.028, LX=-0.33;
      box(oxx*0.4+LX,4.05,0.05,0.02,0.30,0.02,Acol.cable);
      box(oxx+LX,3.35,0.06,0.02,0.42,0.02,Acol.cable);
      box(oxx*1.4+LX,2.75,0.05,0.02,0.30,0.02,Acol.cable);
      box(oxx*1.6+LX,2.28,0.05,0.02,0.24,0.02,Acol.cable);
    }
    box(-0.33,3.2,0.05,0.10,0.05,0.05,Acol.device);
    box(-0.02,1.55,0.04,0.27,0.55,0.27,Acol.mesh);
    box(-0.02,1.55,0.32,0.24,0.50,0.012,Acol.device);
    return faces;
  }


  // ================= view + overlay =================
  function makeView(cam,W,H){
    var cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cx=Math.cos(cam.pitch),sx=Math.sin(cam.pitch);
    var focal=(H/2)/Math.tan(cam.fovy/2),ox=W*0.5,oy=H*(cam.oyFrac!==undefined?cam.oyFrac:0.47);
    function rot(p){var x=p[0],y=p[1]-cam.yCenter,z=p[2];
      var x1=cy*x-sy*z,z1=sy*x+cy*z; var y1=cx*y+sx*z1,z2=-sx*y+cx*z1; return [x1,y1,z2-cam.camDist];}
    function rl(p){var x=p[0],y=p[1],z=p[2]; var x1=cy*x-sy*z,z1=sy*x+cy*z; var y1=cx*y+sx*z1,z2=-sx*y+cx*z1; return [x1,y1,z2];}
    function proj(c){var f=focal/Math.max(0.05,-c[2]); return [ox+c[0]*f,oy-c[1]*f];}
    return {rot:rot,rl:rl,proj:proj};
  }

  // ---- Work page: the rig, turning slowly, blended as a negative over the video ----
  var OV = { rate:0.00025, dist:19.0, oyFrac:0.45 };   // rad/ms (one turn ~25s), camera distance, vertical anchor
  function renderOverlay(t){
    var cv=EL.workcanvas, ctx=A.octx; if(!cv||!ctx) return;
    var W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H);
    var cam={yaw:-0.50+t*OV.rate, pitch:0.085+Math.sin(t*0.00017)*0.012, yCenter:3.95, camDist:OV.dist, fovy:0.55, oyFrac:OV.oyFrac};
    var V=makeView(cam,W,H);
    var lw=[-0.35,0.92,0.42]; var ll=Math.hypot(lw[0],lw[1],lw[2]); var L=V.rl([lw[0]/ll,lw[1]/ll,lw[2]/ll]);
    var faces=A.faces, draw=[];
    for(var i=0;i<faces.length;i++){
      var f=faces[i], n=V.rl(f.n), cvp=f.v.map(V.rot);
      var cz=0,ccx=0,ccy=0,ccz=0;
      for(var k=0;k<cvp.length;k++){ cz+=cvp[k][2]; ccx+=cvp[k][0]; ccy+=cvp[k][1]; ccz+=cvp[k][2]; }
      var m=cvp.length; cz/=m; ccx/=m; ccy/=m; ccz/=m;
      var tl=Math.hypot(ccx,ccy,ccz)||1; var facing=-(n[0]*ccx+n[1]*ccy+n[2]*ccz)/tl;
      if(facing<=0.02) continue;
      var diff=Math.max(0,n[0]*L[0]+n[1]*L[1]+n[2]*L[2]);
      var fres=Math.pow(1-Math.min(1,facing),3);
      var v=Math.min(1,0.42+0.5*diff+0.3*fres);          // white = full inversion, grey = partial
      draw.push({cz:cz,fi:i,s:cvp.map(V.proj),v:v});
    }
    draw.sort(function(a,b){var d=a.cz-b.cz; return Math.abs(d)>1e-4?d:a.fi-b.fi;});
    for(var d=0;d<draw.length;d++){
      var dd=draw[d], s=dd.s; ctx.beginPath(); ctx.moveTo(s[0][0],s[0][1]);
      for(var si=1;si<s.length;si++) ctx.lineTo(s[si][0],s[si][1]); ctx.closePath();
      var g=Math.round(dd.v*255); ctx.fillStyle='rgb('+g+','+g+','+g+')'; ctx.fill();
      ctx.lineWidth=Math.max(0.6,DPR*0.6); ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.stroke();
    }
  }


  function resize(){
    var cv=EL.workcanvas, w=EL.wrap; if(!cv||!w) return;
    var W=w.clientWidth||window.innerWidth, H=w.clientHeight||window.innerHeight;
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  }

  // ---- pages ----
  function setPage(name){
    S.page=name;
    var pages={work:EL.work, contact:EL.contact, cv:EL.cv};
    Object.keys(pages).forEach(function(k){ var el=pages[k]; if(!el) return; var on=(k===name);
      el.style.opacity=on?'1':'0'; el.style.pointerEvents=on?'auto':'none'; });
    if(EL.worklink) EL.worklink.style.pointerEvents=(name==='work')?'auto':'none';
    if(EL.mail) EL.mail.style.pointerEvents=(name==='contact')?'auto':'none';
    [[EL.video,'work'],[EL.video2,'contact']].forEach(function(pv){ var v=pv[0]; if(!v) return;
      if(name===pv[1]){ v.play().catch(function(){}); } else if(!v.paused){ v.pause(); } });
    if(name==='contact' && !S.mailSet && EL.mail){
      var u=['tom','naerland'].join('.'); var d=['gmail','com'].join('.');
      var addr=u+String.fromCharCode(64)+d;
      EL.mail.textContent=addr; EL.mail.href='mai'+'lto:'+addr; S.mailSet=true;
    }
  }

  // ---- nav handlers ----
  // The Work page IS the main page: clicking Work goes to "/". Landing on "/work" keeps that
  // path (it is a valid alias), so a shared /work link stays what the visitor sees in the bar.
  function goMain(e){ if(e) e.preventDefault(); setPage('work'); setUrl('/'); }
  function goWork(e){ if(e) e.preventDefault(); setPage('work'); setUrl('/work'); }
  function goCV(e){ if(e) e.preventDefault(); setPage('cv'); setUrl('/cv'); }
  function goContact(e){ if(e) e.preventDefault(); setPage('contact'); setUrl('/contact'); }
  EL.navwork.addEventListener('click', goMain);
  EL.navcv.addEventListener('click', goCV);
  EL.navcontact.addEventListener('click', goContact);

  // ---- routes: / and /work are the same page. /work /cv /contact are real URLs: GitHub Pages serves
  // work/index.html etc., which bounce to /#work; we open that page and rewrite the URL back to /work.
  // Clicking nav pushes the matching path; back/forward re-apply the route. ----
  var ROUTES={work:goWork, cv:goCV, contact:goContact};
  function setUrl(path){
    if(location.protocol==='file:') return;
    try{
      if(S._routing) history.replaceState(null,'',path);
      else if(location.pathname+location.hash!==path) history.pushState(null,'',path);
    }catch(e){}
  }
  function routeFromLocation(){
    var h=location.hash.replace(/^#\/?/,'').toLowerCase();
    var p=location.pathname.replace(/^\/|\/$/g,'').toLowerCase();
    return ROUTES[h]?h:(ROUTES[p]?p:'');
  }
  function applyRoute(){ var r=routeFromLocation(); S._routing=true; try{ (ROUTES[r]||goMain)(); } finally{ S._routing=false; } }
  window.addEventListener('popstate', applyRoute);

  // ---- boot ----
  A.faces = buildScene();
  A.octx = EL.workcanvas ? EL.workcanvas.getContext('2d') : null;
  resize();
  window.addEventListener('resize', resize);
  applyRoute();
  (function loop(t){
    try{
      if(S.page==='work'){ renderOverlay(t); if(EL.video && EL.video.paused) EL.video.play().catch(function(){}); }
      else if(S.page==='contact' && EL.video2 && EL.video2.paused){ EL.video2.play().catch(function(){}); }
    }catch(e){ /* keep running */ }
    requestAnimationFrame(loop);
  })(performance.now());
})();
</script>
</body>
</html>
